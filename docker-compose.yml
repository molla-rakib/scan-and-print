# Local MongoDB (single-node replica set, needed for transactions). PDFs are stored in it via GridFS.
# Start with: docker compose up -d
name: mudron

services:
  mongo:
    # Pinned so everyone runs the same version. mongo:8.0 crashes on Linux kernels 6.19–7.0.13 (SERVER-121912).
    # Never pin lower than the data was last opened with: a newer mongod raises the data's featureCompatibilityVersion,
    # and older binaries then refuse to start (exit 62). The local volume is FCV 8.3 (it was once run with mongo:8).
    image: mongo:8.3
    command: --replSet rs0 --bind_ip_all
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    # Initiates the replica set on first boot.
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status().ok } catch { rs.initiate({ _id:'rs0', members:[{ _id:0, host:'localhost:27017' }] }).ok }"
      interval: 5s
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo-data:
