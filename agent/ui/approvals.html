<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>/*STYLE*/
  .list { display: grid; gap: 12px; }
  .card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 1px 2px oklch(0 0 0 / 0.04);
    animation: in 0.2s ease-out;
  }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .top { display: flex; align-items: center; gap: 12px; }
  .token {
    flex: none;
    min-width: 64px;
    padding: 6px 10px;
    border-radius: 10px;
    background: var(--primary-soft);
    color: var(--primary);
    text-align: center;
  }
  .token small { display: block; font-size: 11px; font-weight: 600; line-height: 1.2; opacity: 0.8; }
  .token span { display: block; font-size: 24px; font-weight: 800; line-height: 1.2; }
  .details { flex: 1; min-width: 0; font-size: 14px; }
  .details .what { font-weight: 600; }
  .details .when { color: var(--muted-fg); font-size: 13px; }
  .chip {
    display: inline-block;
    padding: 0 8px;
    border-radius: 999px;
    font-size: 12px; font-weight: 600;
    background: var(--muted); color: var(--muted-fg);
    vertical-align: 1px;
  }
  .chip.color { background: oklch(0.95 0.05 330); color: oklch(0.5 0.2 330); }
  .amount { flex: none; text-align: right; }
  .amount small { display: block; font-size: 11px; color: var(--muted-fg); font-weight: 600; line-height: 1.2; }
  .amount span { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .actions { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<header class="brand">
  <!--LOGO-->
  <div>
    <div class="brand-name">ক্যাশ অর্ডার</div>
    <div class="brand-sub">টোকেন মিলিয়ে টাকা নিন, তারপর প্রিন্ট শুরু করুন</div>
  </div>
  <span id="count" class="badge hidden"></span>
</header>
<main>
  <div id="error" class="alert"></div>
  <div id="list" class="list"></div>
  <div id="empty" class="state hidden">
    <div class="icon muted">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>
    </div>
    <h1>কোনো অর্ডার অপেক্ষায় নেই</h1>
    <p>গ্রাহক ক্যাশে অর্ডার দিলে এখানে দেখাবে, সাথে একটি শব্দও হবে।</p>
  </div>
</main>
<script>
  const digits = (n) => Number(n).toLocaleString("bn-BD")
  const time = (iso) => new Date(iso).toLocaleTimeString("bn-BD", { hour: "numeric", minute: "2-digit" })
  const send = (msg) => window.ipc && window.ipc.postMessage(JSON.stringify(msg))
  const $ = (id) => document.getElementById(id)
  document.addEventListener("contextmenu", (e) => e.preventDefault())

  function el(tag, className, html) {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (html !== undefined) node.innerHTML = html
    return node
  }

  function decide(card, id, approve, button) {
    card.querySelectorAll("button").forEach((b) => (b.disabled = true))
    button.innerHTML = '<span class="spinner"></span> ' + button.textContent
    $("error").textContent = ""
    send({ type: approve ? "approve" : "cancel", id })
  }

  // Called from Rust with the current list of cash orders.
  window.render = (jobs) => {
    $("list").replaceChildren()
    $("empty").classList.toggle("hidden", jobs.length > 0)
    $("count").classList.toggle("hidden", jobs.length === 0)
    $("count").textContent = digits(jobs.length)
    for (const job of jobs) {
      const card = el("div", "card")
      const color = job.colorMode === "color"
      card.append(
        el("div", "top", `
          <div class="token"><small>টোকেন</small><span>${digits(job.token)}</span></div>
          <div class="details">
            <div class="what">${digits(job.pageCount)} পৃষ্ঠা × ${digits(job.copies)} কপি <span class="chip ${color ? "color" : ""}">${color ? "রঙিন" : "সাদা-কালো"}</span></div>
            <div class="when">${time(job.createdAt)}</div>
          </div>
          <div class="amount"><small>নিতে হবে</small><span>৳${digits(job.amount)}</span></div>`)
      )
      const actions = el("div", "actions")
      const cancel = el("button", "", "বাতিল")
      const approve = el("button", "primary", "টাকা পেয়েছি, প্রিন্ট করুন")
      cancel.addEventListener("click", () => decide(card, job.id, false, cancel))
      approve.addEventListener("click", () => decide(card, job.id, true, approve))
      actions.append(cancel, approve)
      card.append(actions)
      $("list").append(card)
    }
  }

  window.showError = (text) => {
    $("error").textContent = text
    document.querySelectorAll(".card button").forEach((b) => {
      b.disabled = false
      b.querySelector(".spinner")?.remove()
    })
  }
  send({ type: "ready" })
</script>
</body>
</html>
