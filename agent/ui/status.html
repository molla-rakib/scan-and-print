<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<style>/*STYLE*/
  .status { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--muted); }
  .status .dot { flex: none; width: 12px; height: 12px; border-radius: 999px; background: var(--muted-fg); }
  .status.online { background: var(--success-soft); }
  .status.online .dot { background: var(--success); box-shadow: 0 0 0 4px oklch(0.52 0.14 152 / 0.18); }
  .status.offline { background: var(--danger-soft); }
  .status.offline .dot { background: var(--danger); }
  .status-title { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .status-text { color: var(--muted-fg); font-size: 13px; line-height: 1.4; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 14px; }
  dt { color: var(--muted-fg); }
  dd { margin: 0; text-align: right; font-weight: 600; }
  .note { margin: 0; color: var(--muted-fg); font-size: 12px; text-align: center; }
  .alert.info { background: var(--primary-soft); color: var(--primary); }
</style>
</head>
<body>
<header class="brand">
  <!--LOGO-->
  <div>
    <div class="brand-name">মুদ্রণ</div>
    <div class="brand-sub">প্রিন্ট এজেন্ট</div>
  </div>
</header>
<main>
  <div id="status" class="status">
    <span class="dot"></span>
    <div>
      <div id="status-title" class="status-title">চালু হচ্ছে…</div>
      <div id="status-text" class="status-text"></div>
    </div>
  </div>
  <div id="hint" class="alert info"></div>
  <div id="warning" class="alert"></div>
  <dl>
    <dt>দোকান</dt><dd id="shop">—</dd>
    <dt>চালু প্রিন্টার</dt><dd id="printers">—</dd>
    <dt>সর্বশেষ প্রিন্ট</dt><dd id="last">—</dd>
    <dt>ভার্সন</dt><dd id="version">—</dd>
  </dl>
  <div style="margin-top:auto; display:grid; gap:10px">
    <div class="row">
      <button type="button" id="dashboard" class="primary">ড্যাশবোর্ড খুলুন</button>
      <button type="button" id="close">বন্ধ করুন</button>
    </div>
    <p class="note">উইন্ডো বন্ধ করলেও এজেন্ট টাস্কবারের কোণে (ট্রে) চলতে থাকবে।</p>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id)
  const send = (msg) => window.ipc && window.ipc.postMessage(JSON.stringify(msg))
  const digits = (n) => Number(n).toLocaleString("bn-BD")
  document.addEventListener("contextmenu", (e) => e.preventDefault())
  $("dashboard").addEventListener("click", () => send({ type: "openDashboard" }))
  $("close").addEventListener("click", () => send({ type: "close" }))

  const STATES = {
    starting: ["", "চালু হচ্ছে…", "সার্ভারের সাথে সংযোগ করা হচ্ছে"],
    online: ["online", "অনলাইন", "নতুন অর্ডার এলে নিজে থেকে প্রিন্ট হবে"],
    offline: ["offline", "অফলাইন", "ইন্টারনেট সংযোগ নেই, আবার চেষ্টা করছে"],
    unpaired: ["offline", "দোকানের সাথে যুক্ত নয়", "ট্রে মেনু থেকে আবার যুক্ত করুন"],
  }

  // Called from Rust whenever the agent's state changes.
  window.render = (s) => {
    const [cls, title, text] = STATES[s.state] || STATES.starting
    $("status").className = "status " + cls
    $("status-title").textContent = title
    $("status-text").textContent = text
    $("shop").textContent = s.shop || "—"
    $("printers").textContent = s.state === "online" ? `${digits(s.enabled)} / ${digits(s.printers)}` : "—"
    $("last").textContent = s.lastJob ? `#${digits(s.lastJob.token)} ${s.lastJob.ok ? "প্রিন্ট হয়েছে" : "প্রিন্ট হয়নি"}` : "—"
    $("version").textContent = s.version
    $("hint").textContent =
      s.state === "online" && s.enabled === 0
        ? s.printers > 0
          ? "ড্যাশবোর্ডের ডিভাইস পেজে প্রিন্টারগুলো চালু করুন, তারপর অর্ডার প্রিন্ট হবে।"
          : "এই কম্পিউটারে কোনো প্রিন্টার পাওয়া যায়নি। Windows-এ প্রিন্টার ইনস্টল করুন।"
        : ""
    $("warning").textContent = s.sumatraMissing ? "প্রিন্ট সফটওয়্যার এখনো ডাউনলোড হয়নি। ইন্টারনেট চালু রাখুন, নিজে থেকেই আবার চেষ্টা করবে।" : ""
  }
  send({ type: "ready" })
</script>
</body>
</html>
