[package]
name = "scan-print-agent"
version = "0.1.0"
edition = "2024"
description = "Scan & Print agent: prints customer jobs on the shop's Windows printers"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.1", features = ["json"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Xps",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
