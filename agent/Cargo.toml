[package]
name = "scan-print-agent"
version = "1.0.1"
edition = "2024"
description = "Scan & Print agent: prints customer jobs on the shop's Windows printers"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = { version = "3.5.1", features = ["json"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_Storage_Xps",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
wry = "0.57.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
